name: Build & Deploy Engine
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 2.32.10
      FFMPEG_VERSION: '9.0'
      GH_CPU_ARCH: multiarch
      GH_CPU_OS: android
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install dependencies
      run: bash scripts/gha/deps_android.sh
    - name: Build engine
      run: bash scripts/gha/build_android.sh
    - name: Upload engine (artifacts)
      uses: actions/upload-artifact@v7
      with:
        name: artifact-android-multiarch
        path: artifacts/*
  release:
    name: "Upload releases"
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Remove old release, fetch artifacts, package new binaries and upload new release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BASE_BUILDNUM_DATE: "2015-04-01"
      run: bash scripts/gha/make_release.sh "Cry of Fear" "${{ github.ref_name }}"
